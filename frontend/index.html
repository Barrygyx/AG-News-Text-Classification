<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AG News Classifier</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            width: 600px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
        }

        p {
            color: #666;
        }

        textarea {
            width: 100%;
            height: 160px;
            padding: 12px;
            box-sizing: border-box;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            resize: vertical;
        }

        button {
            margin-top: 15px;
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #result {
            margin-top: 25px;
            padding: 15px;
            background: #f4f6f8;
            border-radius: 8px;
            display: none;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>AG News Classifier</h1>

        <p>
            Enter a news article and the model will classify it as
            World, Sports, Business, or Sci/Tech.
        </p>

        <textarea
            id="newsText"
            placeholder="Enter a news article here..."
        ></textarea>

        <button onclick="classifyNews()">
            Classify
        </button>

        <div id="result"></div>

    </div>


    <script>

        async function classifyNews() {

            const text = document.getElementById(
                "newsText"
            ).value;

            const resultBox = document.getElementById(
                "result"
            );

            if (!text.trim()) {
                resultBox.style.display = "block";
                resultBox.innerHTML =
                    "Please enter a news article.";
                return;
            }


            resultBox.style.display = "block";
            resultBox.innerHTML = "Classifying...";


            try {

                const response = await fetch(
                    "/predict",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            text: text
                        })
                    }
                );


                const data = await response.json();


                resultBox.innerHTML =
                    "<strong>Prediction:</strong> "
                    + data.prediction;

            }

            catch (error) {

                resultBox.innerHTML =
                    "Something went wrong.";

            }
        }

    </script>

</body>

</html>
